[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-cortex"
version = "0.1.0"
description = "Modular Retrieval-Augmented Generation application"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "fastembed>=0.9.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.1",
    "langchain-qdrant>=1.1.0",
    "ollama>=0.6.3",
    "openai>=3.29.0",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "qdrant-client>=1.19.1",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
