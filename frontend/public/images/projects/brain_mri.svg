<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mriBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="50%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#081827"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#mriBg)"/>

  <!-- MRI Cranial Outline -->
  <g transform="translate(180, 70)">
    <!-- Skull silhouette -->
    <path d="M 120 40 C 40 40, 10 110, 10 190 C 10 270, 50 310, 120 310 C 190 310, 230 270, 230 190 C 230 110, 200 40, 120 40 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <!-- Ventricles & Brain contours -->
    <path d="M 100 130 Q 120 110 140 130 Q 130 170 140 210 Q 120 220 100 210 Q 110 170 100 130 Z" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Tumor Sub-regions (BraTS Multi-label Segmentation) -->
    <!-- Whole Tumor (Edema) - Green -->
    <path d="M 140 120 Q 185 105 195 140 Q 205 175 170 190 Q 135 180 140 120 Z" fill="#10b981" fill-opacity="0.35" stroke="#34d399" stroke-width="2"/>

    <!-- Tumor Core - Yellow/Cyan -->
    <path d="M 150 130 Q 180 120 185 145 Q 190 170 165 175 Q 145 165 150 130 Z" fill="#06b6d4" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Enhancing Tumor - Violet/Red -->
    <circle cx="168" cy="148" r="14" fill="#e11d48" fill-opacity="0.8" stroke="#f43f5e" stroke-width="1.5"/>

    <!-- 3D Voxel Coordinate Matrix Lines -->
    <g stroke="#06b6d4" stroke-width="1" opacity="0.3" stroke-dasharray="2,2">
      <line x1="20" y1="148" x2="220" y2="148"/>
      <line x1="168" y1="50" x2="168" y2="300"/>
    </g>
  </g>

  <!-- Segmentation Metrics Panel on Right -->
  <g transform="translate(480, 75)">
    <rect width="260" height="290" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="32" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">3D VOLUMETRIC METRICS</text>

    <!-- Whole Tumor Metric -->
    <g transform="translate(20, 55)">
      <circle cx="8" cy="8" r="6" fill="#10b981"/>
      <text x="22" y="12" fill="#cbd5e1" font-family="sans-serif" font-size="12">Whole Tumor (WT)</text>
      <text x="22" y="30" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">Dice Score: 0.892 | 48.2 cm³</text>
    </g>

    <!-- Tumor Core Metric -->
    <g transform="translate(20, 115)">
      <circle cx="8" cy="8" r="6" fill="#06b6d4"/>
      <text x="22" y="12" fill="#cbd5e1" font-family="sans-serif" font-size="12">Tumor Core (TC)</text>
      <text x="22" y="30" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">Dice Score: 0.847 | 18.6 cm³</text>
    </g>

    <!-- Enhancing Core Metric -->
    <g transform="translate(20, 175)">
      <circle cx="8" cy="8" r="6" fill="#e11d48"/>
      <text x="22" y="12" fill="#cbd5e1" font-family="sans-serif" font-size="12">Enhancing Tumor (ET)</text>
      <text x="22" y="30" fill="#fb7185" font-family="monospace" font-size="11" font-weight="bold">Dice Score: 0.815 | 6.4 cm³</text>
    </g>

    <!-- Architecture Pill -->
    <rect x="20" y="235" width="220" height="32" rx="6" fill="#1e293b"/>
    <text x="32" y="255" fill="#a855f7" font-family="monospace" font-size="11" font-weight="bold">ARCH: MONAI 3D U-NET (FLAIR/T1ce)</text>
  </g>

  <!-- Top Title -->
  <rect x="40" y="25" width="380" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="55" y="50" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">NEUROVOXEL // 3D BRAIN MRI SEGMENTATION</text>
</svg>
