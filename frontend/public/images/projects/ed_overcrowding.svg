<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="edBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#081e2e"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#edBg)"/>

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="150" x2="720" y2="150"/>
    <line x1="80" y1="220" x2="720" y2="220"/>
    <line x1="80" y1="290" x2="720" y2="290"/>
    <line x1="80" y1="360" x2="720" y2="360"/>

    <line x1="160" y1="80" x2="160" y2="360"/>
    <line x1="300" y1="80" x2="300" y2="360"/>
    <line x1="440" y1="80" x2="440" y2="360"/>
    <line x1="580" y1="80" x2="580" y2="360"/>
    <line x1="720" y1="80" x2="720" y2="360"/>
  </g>

  <!-- Shift Timeline Region Highlights -->
  <rect x="160" y="80" width="140" height="280" fill="#06b6d4" fill-opacity="0.04"/>
  <rect x="300" y="80" width="140" height="280" fill="#06b6d4" fill-opacity="0.08"/>
  <rect x="440" y="80" width="140" height="280" fill="#f43f5e" fill-opacity="0.08"/>
  <rect x="580" y="80" width="140" height="280" fill="#f43f5e" fill-opacity="0.12"/>

  <!-- Prediction Curve Area & Line -->
  <path d="M 80 320 C 140 310, 200 270, 260 250 C 320 230, 380 260, 440 190 C 500 120, 580 140, 660 110 L 720 95 L 720 360 L 80 360 Z" fill="url(#areaGrad)"/>
  <path d="M 80 320 C 140 310, 200 270, 260 250 C 320 230, 380 260, 440 190 C 500 120, 580 140, 660 110 L 720 95" fill="none" stroke="url(#lineGrad)" stroke-width="3.5"/>

  <!-- Critical Overcrowding Threshold Line -->
  <line x1="80" y1="160" x2="720" y2="160" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.8"/>
  <rect x="540" y="145" width="170" height="24" rx="4" fill="#1e121d" stroke="#f43f5e" stroke-width="1"/>
  <text x="548" y="161" fill="#fb7185" font-family="monospace" font-size="10" font-weight="bold">OVERCROWDING_THRESHOLD (85%)</text>

  <!-- Prediction Transition Marker -->
  <circle cx="440" cy="190" r="7" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="440" cy="190" r="14" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>

  <!-- Shift Labels -->
  <text x="195" y="385" fill="#94a3b8" font-family="monospace" font-size="11">SHIFT_01 (00:00)</text>
  <text x="335" y="385" fill="#94a3b8" font-family="monospace" font-size="11">SHIFT_02 (08:00)</text>
  <text x="475" y="385" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">NEXT_SHIFT (16:00)</text>
  <text x="615" y="385" fill="#f43f5e" font-family="monospace" font-size="11">TRANSITION</text>

  <!-- Telemetry Header -->
  <rect x="40" y="25" width="340" height="40" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#334155"/>
  <text x="55" y="50" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">MIMIC-IV-ED // PREDICTIVE_SHIFT_PIPELINE</text>

  <rect x="520" y="25" width="240" height="40" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#334155"/>
  <text x="535" y="50" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">qSOFA + PAIN_SCORE ATTRIBUTION</text>
</svg>
