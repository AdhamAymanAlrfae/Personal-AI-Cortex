<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ragBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="50%" stop-color="#110e24"/>
      <stop offset="100%" stop-color="#08152a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ragBg)"/>

  <!-- Connecting Workflow Lines -->
  <g stroke="#8b5cf6" stroke-width="2" opacity="0.6" stroke-dasharray="4,4">
    <line x1="180" y1="225" x2="380" y2="140"/>
    <line x1="180" y1="225" x2="380" y2="225"/>
    <line x1="180" y1="225" x2="380" y2="310"/>
    <line x1="420" y1="140" x2="620" y2="225"/>
    <line x1="420" y1="225" x2="620" y2="225"/>
    <line x1="420" y1="310" x2="620" y2="225"/>
  </g>

  <!-- Central Nodes: Multi-Agent Orchestration -->
  <!-- 1. Clinical Query Input Node -->
  <g transform="translate(100, 180)">
    <rect width="160" height="90" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="25" cy="30" r="8" fill="#06b6d4"/>
    <text x="42" y="34" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">USER_CLINICIAN</text>
    <text x="20" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11">Complex EHR Query &amp;</text>
    <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11">Differential Diagnosis</text>
  </g>

  <!-- 2. Agent Tier 1: Hybrid Dense/Sparse Retrieval -->
  <g transform="translate(340, 95)">
    <rect width="180" height="90" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="25" cy="30" r="8" fill="#a855f7"/>
    <text x="42" y="34" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">RETRIEVAL_AGENT</text>
    <text x="20" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11">ChromaDB + BM25</text>
    <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="10">PubMed Guidelines</text>
  </g>

  <!-- 3. Agent Tier 2: Pharmacological Validator -->
  <g transform="translate(340, 180)">
    <rect width="180" height="90" rx="10" fill="#062c30" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="25" cy="30" r="8" fill="#10b981"/>
    <text x="42" y="34" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">DRUG_VALIDATOR</text>
    <text x="20" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11">Contraindication Check</text>
    <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="10">SNOMED / UMLS Cross</text>
  </g>

  <!-- 4. Agent Tier 3: Safety & Hallucination Auditor -->
  <g transform="translate(340, 265)">
    <rect width="180" height="90" rx="10" fill="#2d151e" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="25" cy="30" r="8" fill="#f43f5e"/>
    <text x="42" y="34" fill="#fb7185" font-family="monospace" font-size="11" font-weight="bold">SAFETY_AUDITOR</text>
    <text x="20" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11">Fact Grounding Score</text>
    <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="10">Citation Verification</text>
  </g>

  <!-- 5. Final Verified Response -->
  <g transform="translate(560, 180)">
    <rect width="180" height="90" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="25" cy="30" r="8" fill="#38bdf8"/>
    <text x="42" y="34" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">GROUNDED_OUTPUT</text>
    <text x="20" y="60" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">✓ 100% Attributed</text>
    <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="10">Zero Hallucination</text>
  </g>

  <!-- Top Title Bar -->
  <rect x="40" y="25" width="400" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="55" y="50" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold">CLINICALGUARD // MULTI-AGENT LANGGRAPH RAG</text>
</svg>
