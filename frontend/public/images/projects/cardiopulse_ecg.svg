<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ecgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="50%" stop-color="#0c1822"/>
      <stop offset="100%" stop-color="#081e28"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ecgBg)"/>

  <!-- Oscilloscope Medical Grid -->
  <g stroke="#064e3b" stroke-width="0.8" opacity="0.45">
    <pattern id="ecgGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <rect width="25" height="25" fill="none"/>
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#047857" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="450" fill="url(#ecgGrid)"/>
  </g>

  <!-- ECG Trace Waveform (P - Q - R - S - T Complex) -->
  <g transform="translate(0, 40)">
    <!-- Baseline 1 & Beat 1 -->
    <path d="M 40 200 L 120 200 Q 135 185 150 200 L 165 200 L 175 220 L 190 60 L 205 270 L 215 200 L 230 200 Q 255 170 280 200 L 360 200 Q 375 185 390 200 L 405 200 L 415 220 L 430 60 L 445 270 L 455 200 L 470 200 Q 495 170 520 200 L 600 200 Q 615 185 630 200 L 645 200 L 655 220 L 670 60 L 685 270 L 695 200 L 760 200" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pan-Tompkins Peak Detection Markers on R-wave -->
    <g transform="translate(190, 60)">
      <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="12" y="-5" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">R_PEAK (QRS)</text>
    </g>

    <g transform="translate(430, 60)">
      <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="12" y="-5" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">R_PEAK (QRS)</text>
    </g>

    <g transform="translate(670, 60)">
      <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="12" y="-5" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">R_PEAK (QRS)</text>
    </g>
  </g>

  <!-- DSP Telemetry HUD Badges -->
  <g font-family="monospace" font-size="11" transform="translate(40, 360)">
    <rect width="210" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="15" y="22" fill="#94a3b8">DIGITAL FILTER:</text>
    <text x="15" y="38" fill="#10b981" font-weight="bold">BUTTERWORTH (0.5-45Hz)</text>

    <rect x="230" width="220" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="245" y="22" fill="#94a3b8">HEART RATE (BPM):</text>
    <text x="245" y="38" fill="#38bdf8" font-weight="bold">72 BPM (NORMAL SINUS)</text>

    <rect x="470" width="250" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="485" y="22" fill="#94a3b8">DSP DETECTION LATENCY:</text>
    <text x="485" y="38" fill="#a855f7" font-weight="bold">&lt; 8.4 ms (REAL-TIME)</text>
  </g>

  <!-- Top Title -->
  <rect x="40" y="25" width="450" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="55" y="50" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">CARDIOPULSE // REAL-TIME ECG DSP &amp; QRS FILTER</text>
</svg>
